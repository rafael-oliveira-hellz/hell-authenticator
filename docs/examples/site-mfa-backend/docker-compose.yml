version: '3.9'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: site_mfa
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/site_mfa?schema=public
      - JWT_SECRET=changeme_super_secret
      - ENCRYPTION_KEY=32charslongencryption_key_12345
    ports:
      - "8080:8080"
    depends_on:
      - db
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  db-data:


